[project]
name = "sas-graph"
version = "0.1.0"
description = "Source-only static dependency graph for SAS task programs"
requires-python = ">=3.8"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
sas-graph = "sas_graph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
